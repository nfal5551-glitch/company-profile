<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Lowongan — Lokeria.id</title>
  <link rel="icon" href="images/logo-icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="jobs.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Navigasi utama">
      <a class="brand" href="index.html">
        <img src="images/logo-icon.png" alt="" class="brand-logo" width="34" height="34">
        <span class="brand-mark">L</span>
        Lokeria<span class="brand-dot">.id</span>
      </a>
      <button class="menu-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
                  <div class="nav-links">
        <a class="nav-link" href="index.html" data-i18n="nav.home">Home</a>
        <a class="nav-link active" href="lowongan.html" data-i18n="nav.jobs">Lowongan</a>
        <a class="nav-link" href="iklan.html" data-i18n="nav.advertise">Perusahaan</a>
        <a class="nav-link" href="kategori.html" data-i18n="nav.category">Kategori</a>
        <a class="nav-link" href="portfolio.html" data-i18n="nav.portfolio">Portofolio</a>
        <a class="nav-link" href="about.html" data-i18n="nav.about">Tentang</a>
        <a class="nav-link" href="contact.html" data-i18n="nav.contact">Kontak</a>
        <a class="nav-link" href="faq.html" data-i18n="nav.faq">FAQ</a>
      </div>
      <div class="search-wrap search-wrap-prominent">
        <label class="search-label" for="job-search">
          <svg class="search-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="job-search" class="search-input" data-i18n-placeholder="search.placeholder" placeholder="Jabatan, perusahaan, atau kata kunci..." autocomplete="off">
        </label>
        <div class="search-results" id="search-results" role="listbox"></div>
      </div>
      <button type="button" class="lang-toggle" id="lang-toggle">EN</button>
      <a class="nav-login-btn" href="login.html" data-auth-label="1" data-i18n="nav.login">Masuk</a>
      <a class="nav-cta-btn" href="lowongan.html" data-i18n="nav.cta">Cari kerja</a>
    </nav>
  </header>

  <main>
    <section class="section container" id="detail-root">
      <p class="muted">Memuat lowongan…</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-main">
      <a class="brand brand-footer" href="index.html"><span class="brand-mark">L</span> Lokeria<span class="brand-dot">.id</span></a>
      <p data-i18n="footer.tagline">Menghubungkan potensi dengan peluang.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="lowongan.html">Lowongan</a>
        <a href="iklan.html">Iklankan</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
      </div>
      <div class="footer-social">
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="LinkedIn">in</a>
        <a href="#" aria-label="X">X</a>
      </div>
    </div>
    <div class="container footer-bottom">
      <span>© <span data-year></span> Lokeria.</span>
      <span>Demo untuk tugas — bukan lowongan resmi.</span>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(location.search);
      const id = params.get('job');
      const jobs = window.LOKERIA_JOBS || [];
      const job = jobs.find(j => j.id === id) || jobs[0];
      const root = document.getElementById('detail-root');
      if (!job) {
        root.innerHTML = '<p>Lowongan tidak ditemukan. <a href="lowongan.html">Kembali</a></p>';
        return;
      }
      document.title = job.title + ' — Lokeria.id';
      root.innerHTML = `
        <a href="lowongan.html" class="text-link">← Kembali ke lowongan</a>
        <div class="detail-header">
          <div class="job-logo-wrap detail-logo">
            <img src="images/${job.logo}" alt="${job.company}" class="job-logo-img">
          </div>
          <div>
            <div class="job-meta">
              <span class="job-company">${job.company}</span>
              <span class="job-badge">${job.type}</span>
            </div>
            <h1 class="detail-title">${job.title}</h1>
            <p class="detail-meta">📍 ${job.location} · 💰 Kompetitif</p>
            <div class="detail-actions">
              <a class="button button-primary" href="lamar.html?job=${job.id}">Lamar sekarang →</a>
              <button type="button" class="button button-secondary fav-btn" data-fav="${job.id}">♥ Simpan</button>
            </div>
          </div>
        </div>
        <div class="detail-grid">
          <div class="detail-block">
            <h2>Deskripsi pekerjaan</h2>
            <p>${job.description || ''}</p>
          </div>
          <div class="detail-block">
            <h2>Persyaratan</h2>
            <ul>${(job.requirements || []).map(r => '<li>' + r + '</li>').join('')}</ul>
          </div>
          <div class="detail-block">
            <h2>Benefit</h2>
            <ul>${(job.benefits || []).map(r => '<li>' + r + '</li>').join('')}</ul>
          </div>
        </div>
      `;
      // rebind fav after inject
      const favs = JSON.parse(localStorage.getItem('lokeria_favorites') || '[]');
      root.querySelectorAll('[data-fav]').forEach(btn => {
        if (favs.includes(btn.getAttribute('data-fav'))) btn.classList.add('is-active');
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          window.toggleFavorite(btn.getAttribute('data-fav'));
        });
      });
    });
  </script>
</body>
</html>
